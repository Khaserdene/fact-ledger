[project]
name = "fact-ledger-backend"
version = "0.1.0"
description = "Fact Ledger FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.43",
    "pydantic>=2.12",
    "pydantic-settings>=2.7",
    "alembic>=1.16",
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.13",
    "trafilatura>=2.0",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.13",
    "google-genai>=1.0",
    "anthropic>=0.75",
    "psycopg2-binary>=2.9.9",
]

[tool.vercel]
entrypoint = "main:app"
